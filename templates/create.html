{% extends "base.html" %}
{% block content %}
<div class="glass-panel">
    <h2>Crear Nuevo Producto</h2>
    
    <form action="{{ url_for('create') }}" method="POST">
        <div class="form-group">
            <label for="name">Nombre del Producto</label>
            <input type="text" id="name" name="name" required placeholder="Ej: Laptop Asus">
        </div>
        
        <div class="form-group">
            <label for="price">Precio ($)</label>
            <input type="number" step="0.01" id="price" name="price" required placeholder="Ej: 999.99">
        </div>
        
        <div class="form-group">
            <label for="stock">Stock Disponible</label>
            <input type="number" id="stock" name="stock" value="0" required>
        </div>
        
        <div class="d-flex gap-4 mt-4">
            <button type="submit" class="btn btn-primary">Guardar Producto</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
