{% extends "base.html" %}
{% block content %}
<div class="glass-panel">
    <h2>Editar Producto #{{ product.id }}</h2>
    
    <form action="{{ url_for('edit', id=product.id) }}" method="POST">
        <div class="form-group">
            <label for="name">Nombre del Producto</label>
            <input type="text" id="name" name="name" value="{{ product.name }}" required>
        </div>
        
        <div class="form-group">
            <label for="price">Precio ($)</label>
            <input type="number" step="0.01" id="price" name="price" value="{{ product.price }}" required>
        </div>
        
        <div class="form-group">
            <label for="stock">Stock Disponible</label>
            <input type="number" id="stock" name="stock" value="{{ product.stock }}" required>
        </div>
        
        <div class="d-flex gap-4 mt-4">
            <button type="submit" class="btn btn-primary">Actualizar Producto</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
