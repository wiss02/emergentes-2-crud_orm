{% extends "base.html" %}
{% block content %}
<div class="glass-panel">
    <h2>Detalles del Producto</h2>
    
    <div style="margin-top: 1.5rem; line-height: 2; background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 8px;">
        <p><strong>ID:</strong> {{ product.id }}</p>
        <p><strong>Nombre:</strong> {{ product.name }}</p>
        <p><strong>Precio:</strong> ${{ "%.2f"|format(product.price) }}</p>
        <p><strong>Stock:</strong> {{ product.stock }} unidades</p>
    </div>
    
    <div class="d-flex gap-4 mt-4">
        <a href="{{ url_for('edit', id=product.id) }}" class="btn btn-primary">Editar</a>
        <a href="{{ url_for('index') }}" class="btn btn-outline">Volver a la Lista</a>
    </div>
</div>
{% endblock %}
